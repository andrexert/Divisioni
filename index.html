<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impariamo insieme</title>
  <link rel="stylesheet" href="css/stile.css">
  <!-- Web app installabile: nome, icona e colore nella barra del sistema -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1565d8">
  <link rel="icon" type="image/png" href="img/icona-64.png">
  <link rel="apple-touch-icon" href="img/icona-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Impariamo">
</head>
<body>
  <header class="barra">
    <button id="btn-menu" class="bottone-barra" type="button" hidden>&#8592; Menu</button>
    <h1 id="titolo">Impariamo insieme</h1>
    <!-- Apre l'area docente, che chiede di scrivere una parola: evita che i ragazzi
         cambino le impostazioni per curiosità -->
    <button id="btn-impostazioni" class="bottone-barra" type="button"
            aria-label="Impostazioni per il docente">&#9881;</button>
  </header>

  <main id="contenuto" tabindex="-1"></main>

  <!-- Script classici (non moduli): così funziona anche aprendo il file con un doppio clic -->
  <script src="js/app.js"></script>
  <script src="js/comune.js"></script>
  <script src="js/quaderno.js"></script>
  <!-- Le macro aree del menu (una per operazione) e, dentro ciascuna, le attività -->
  <script src="js/aree.js"></script>
  <script src="js/attivita/addizioni.js"></script>
  <script src="js/attivita/addizioni-colonna.js"></script>
  <script src="js/attivita/sottrazioni.js"></script>
  <script src="js/attivita/sottrazioni-colonna.js"></script>
  <script src="js/attivita/moltiplicazioni.js"></script>
  <script src="js/attivita/moltiplicazioni-colonna.js"></script>
  <script src="js/attivita/divisioni.js"></script>
  <script src="js/attivita/colonna.js"></script>
  <script src="js/attivita/problemi.js"></script>
  <script>Impariamo.avvia();</script>
</body>
</html>
