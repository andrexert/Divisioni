# Pubblica "Impariamo insieme" su GitHub Pages a ogni modifica del branch main.
# Prima volta: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pubblica la web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il sito
        run: python3 tools/prepara_sito.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: pubblicazione
        uses: actions/deploy-pages@v4
